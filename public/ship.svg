<svg width="250" height="250" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <!-- 파도 (흰색으로 변경하여 잘 보이도록 함) -->
  <path d="M 40,125 Q 70,115 100,125 T 160,125" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M 50,135 Q 80,125 110,135 T 170,135" fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- 보트 선체 (짙은 남색으로 변경) -->
  <path d="M 40,102 C 55,128 150,128 168,105 Q 120,98 75,100 L 40,102 Z" fill="#0D47A1"/>

  <!-- 돛 색상 변경 -->

  <!-- 1. 가장 작은 돛 (오른쪽) - 중간 회색 -->
  <path d="M 140,98 Q 133,83 140,68 A 30 30 0 0 0 110,98 Q 125,95 140,98" fill="#B0BEC5"/>

  <!-- 2. 중간 돛 (중앙) - 밝은 회색 -->
  <path d="M 130,96 Q 115,71 130,46 A 50 50 0 0 0 80,96 Q 105,85 130,96" fill="#E0E0E0"/>
  
  <!-- 3. 가장 큰 돛 (왼쪽) - 흰색 -->
  <path d="M 105,95 Q 90,60 105,30 A 65 65 0 0 0 40,95 Q 70,75 105,95" fill="#FFFFFF"/>
</svg>